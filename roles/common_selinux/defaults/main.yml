---
# defaults/ = lowest-priority role variables. owner/group are numeric
# UIDs/GIDs because the users exist only inside the containers (33 =
# www-data, 999 = mysql); the host has no user with these names.


# Set selinux_debug: true in host_vars to show the SELinux contexts of the
# directories at the end of the role.
selinux_debug: false

# HostPath directories. Owner/mode MUST match next_k3s_deploy/tasks/dirs.yml,
# otherwise the two roles flip them on every playbook run: www-data could not
# write to the top of the Nextcloud data dir (2026-09-23 on cvjm, status.php
# errored).
selinux_dirs:
  - { label: Nextcloud www dir, path: "{{ nextcloud_k3s_www_dir | default('') }}", owner: 33, group: 33, mode: "0755" }
  - { label: Nextcloud data dir, path: "{{ nextcloud_data_dir | default('') }}", owner: 33, group: 33, mode: "0770" }
  - { label: Ingress country list dir, path: "{{ ingress_admin_geo_dir | default('/srv/ingress-admin-geo') }}", owner: 0, group: 0, mode: "0755" }
