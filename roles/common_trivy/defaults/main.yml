---
# Nightly scan of every image the cluster runs (containerd, no registry
# pulls). 05:15 is after dnf-automatic (01-02), the reboot window (03:30)
# and the 03:45/04:30 jobs.
trivy_schedule: "*-*-* 05:15:00"
trivy_cache_dir: /var/cache/trivy
trivy_report_dir: /var/lib/trivy
trivy_textfile_dir: /var/lib/node_exporter/textfile
trivy_mail: "{{ email }}"
# Only findings of these severities WITH a fixed version count as
# "actionable" - they go into the mail when they are new.
trivy_mail_severities: [CRITICAL, HIGH]
# Of those, these mail the same night; the rest (HIGH) is collected and
# mailed once a week as one digest - Monday is update day anyway, the
# image refresh then fixes most of it. Findings fixed before the digest
# drop out of it. Decided 2026-11-11 (Raphael): fewer mails, CRITICAL
# still at once.
trivy_mail_now_severities: [CRITICAL]
# Digest weekday as in Python's date.weekday(): 0 = Monday. If the host
# was down that day, the next run catches up (digest older than 7 days).
trivy_mail_digest_weekday: 0
# Accepted findings, each with a reason: [{id: CVE-..., reason: "..."}]
# Trivy skips them (written to .trivyignore). Empty on purpose - every
# entry is a decision, not a default.
trivy_ignore: []

# Accepted IMAGES (repository without tag): still scanned and counted in
# Grafana (label accepted="true"), but their findings never mail. After
# "review" the acceptance lapses on its own and the next run mails them
# again - the reminder to decide anew. One entry per decision, with reason.
trivy_accepted_images:
  - image: docker.io/hipages/php-fpm_exporter
    review: "2027-01-20"
    reason: >-
      No release since 2022 (OpenSSL 1.1, old Go), no maintained alternative.
      Sidecar in the PHP pod: talks FastCGI to PHP-FPM on 127.0.0.1 and serves
      /metrics only to Prometheus through a loopback NodePort, no TLS, behind
      NetworkPolicies. Kept for the PHP-FPM panels. Decided 2026-10-20 (Raphael).
