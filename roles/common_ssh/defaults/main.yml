---
# SSH port and key settings are defined in inventory (host_vars/<host>/vars.yml:
# ansible_port).  The sshd_config file is in roles/common_ssh/files/sshd_config.
#
# (No defaults - see the comment below.)

# GSSAPIAuthentication no in 00-hardening.conf (2026-11-22). AlmaLinux's
# 50-redhat.conf says yes; without a Kerberos keytab nobody can log in that
# way, but sshd still offers gssapi-keyex/gssapi-with-mic. Proven on the test
# host for a night, default for all hosts since 2026-11-23.
ssh_disable_gssapi: true
