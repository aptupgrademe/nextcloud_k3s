---
# SSH port and key settings are defined in inventory (host_vars/<host>/vars.yml:
# ansible_port).  The sshd_config file is in roles/common_ssh/files/sshd_config.
#
# (No defaults - see the comment below.)

# GSSAPIAuthentication no in 00-hardening.conf (2026-11-22). AlmaLinux's
# 50-redhat.conf says yes; without a Kerberos keytab nobody can log in that
# way, but sshd still offers gssapi-keyex/gssapi-with-mic. Proven on the test
# host for a night, default for all hosts since 2026-11-23.
ssh_disable_gssapi: true

# Algorithms pinned in 00-hardening.conf. The same lines in files/sshd_config
# never took effect: 50-redhat.conf includes the crypto-policy back-end
# earlier and sshd keeps the first value (sshd -T on 2026-11-23 still offered
# aes-ctr, non-ETM MACs and NIST curves). 00-* sorts first, so these win.
# Post-quantum key exchange first (OpenSSH 9.9 on EL9, 10 on Debian 13),
# curve25519 stays as the fallback for older clients.
# Tested on test from 2026-11-23, default for all hosts since 2026-11-24.
ssh_pin_crypto: true
ssh_kex_algorithms:
  - mlkem768x25519-sha256
  - sntrup761x25519-sha512@openssh.com
  - curve25519-sha256
  - curve25519-sha256@libssh.org
  - diffie-hellman-group-exchange-sha256
ssh_ciphers:
  - chacha20-poly1305@openssh.com
  - aes256-gcm@openssh.com
  - aes128-gcm@openssh.com
ssh_macs:
  - hmac-sha2-512-etm@openssh.com
  - hmac-sha2-256-etm@openssh.com
  - umac-128-etm@openssh.com
