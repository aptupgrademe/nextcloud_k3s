---
# =============================================================================
# Role: common_cis_hardening
# Purpose: CIS AlmaLinux 9 Benchmark (Level 1 - Server) findings that are safe
#          to apply without risking the k3s cluster or locking out admin
#          access. Used by the Nextcloud playbook.
#
# Deliberately NOT covered by this role - see the OpenSCAP audit notes
# (2026-08-20) for the reasoning behind each:
#   - PAM/authselect/pwquality/faillock/pwhistory: authselect reported "No
#     existing configuration detected" on the blog host, i.e. PAM has never
#     been brought under authselect's management here. Enabling it now
#     rewrites /etc/pam.d/system-auth and password-auth structurally - a
#     mistake here risks locking out ALL local/su/sudo auth with no rescue
#     console verified available. SSH itself is already key-only
#     (PasswordAuthentication no), so the practical benefit is small next to
#     the catastrophic-lockout risk. Left for a deliberate, separately
#     scheduled change with console access confirmed first.
#   - GRUB2 bootloader password: real risk of complicating/locking out the
#     hosting provider's rescue console workflow, for a control (physical
#     console access) that mostly doesn't apply to a remote VPS.
#   - Custom crypto policy module for CIS (update-crypto-policies): changes
#     system-wide TLS/SSH cipher acceptance; could break compatibility with
#     something (old TLS client hitting the blog, Ansible's own SSH) without
#     dedicated testing first.
#   - systemd-journal-remote package: installing a log-forwarding daemon
#     nothing is configured to use doesn't add security, just attack surface.
#   - net.ipv4.ip_forward / conf.all.forwarding, rp_filter: see
#     common_sysctl/templates/98-cis-hardening.conf.j2 - required by k3s.
# =============================================================================
#
# How it works: a list of independent hardening items, each one a small
# group of tasks with a comment explaining the CIS finding and why the fix
# is safe here: AIDE (file integrity), kernel module blacklist, journald,
# core dumps, cron/at permissions, sudo, cloud-init user, unused services
# and packages, mount options for /tmp, /var/tmp, /dev/shm.
#
# Ansible concepts used here:
#   lineinfile validate: "visudo -cf %s"  like template validate (see
#                  common_firewall): a broken sudoers file never replaces the
#                  real one - the most important safety net when editing
#                  sudoers with automation
#   getent         reads a system database (passwd, group ...) into the fact
#                  getent_<database>; fail_key: false = no error if the key
#                  is missing
#   .get('x') is not none  safe dict lookup in Jinja: no error when the key
#                  does not exist
#   ansible.posix.mount state: mounted  writes the /etc/fstab line AND
#                  mounts (or remounts) right away; "present" would only
#                  write fstab
#   stat + when "not ...stat.exists"  the one-time-setup pattern (initial
#                  AIDE database)

- name: CIS | Install AIDE (file integrity monitoring)
  ansible.builtin.dnf:
    name: aide
    state: present

# k3s creates a new subdirectory under /var/log/pods for every pod start and
# every CronJob run, which changes the parent directory's link count - AIDE's
# default /var/log ruleset picks that up as a "changed" entry on essentially
# every daily check. Not a security finding, just constant expected k3s
# churn (confirmed live 2026-08-21 and again 2026-08-26 - same false
# positive both times). Excluding the whole subtree is safe: pod logs
# aren't a tamper-detection target, they're ephemeral container stdout/
# stderr capture, not config or binaries.
- name: CIS | Exclude /var/log/pods from AIDE (k3s log churn, not a finding)
  ansible.builtin.lineinfile:
    path: /etc/aide.conf
    line: "!/var/log/pods"
    insertafter: "^/var/log LOG$"

# /var/log/containers holds one symlink per container pointing into
# /var/log/pods - same churn, and when a CronJob pod is cleaned up while the
# check runs, the link dangles and the daily mail starts with "WARNING: failed
# to access '/var/log/pods/...' / '/var/log/containers/...'" (seen 2026-10-09).
- name: CIS | Exclude /var/log/containers from AIDE (symlinks into /var/log/pods)
  ansible.builtin.lineinfile:
    path: /etc/aide.conf
    line: "!/var/log/containers"
    insertafter: '^!/var/log/pods$'

# /boot/efi is a FAT file system (SELinux type dosfs_t), and the policy does not
# let aide_t read it: AIDE silently skipped the partition anyway. Excluding it
# states that honestly. It does NOT silence the denials on its own: AIDE still
# calls statfs() on the mount point - the local policy module below allows
# exactly that. The EFI binaries come from rpm packages (shim, grub2-efi), so
# "rpm -V shim-x64 grub2-efi-x64" checks them by hand if ever needed.
- name: CIS | Exclude /boot/efi from AIDE (vfat, unreadable for aide_t under SELinux)
  ansible.builtin.lineinfile:
    path: /etc/aide.conf
    line: "!/boot/efi"
    insertafter: '^!/var/log/containers$'

# Local SELinux module aide_dosfs (files/aide_dosfs.te, since 2026-10-19):
# allows aide_t to statfs() the vfat /boot/efi - the last source of AVC
# denials on these hosts. The .te source is compiled on the host
# (checkmodule -> .mod, semodule_package -> .pp) and loaded with semodule -i;
# that only happens when the source changed or the module is not loaded.
# "semodule -l | grep aide_dosfs" shows it, "semodule -r aide_dosfs" removes it.
- name: CIS | SELinux module tools (checkmodule, semodule_package)
  ansible.builtin.dnf:
    name: checkpolicy
    state: present

- name: CIS | Directory for local SELinux modules
  ansible.builtin.file:
    path: /etc/selinux/local
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: CIS | Local SELinux module source aide_dosfs.te
  ansible.builtin.copy:
    src: aide_dosfs.te
    dest: /etc/selinux/local/aide_dosfs.te
    owner: root
    group: root
    mode: "0600"
  register: aide_dosfs_te

- name: CIS | Is the aide_dosfs module loaded?
  ansible.builtin.command: semodule -l
  register: selinux_modules
  changed_when: false
  check_mode: false   # read-only query, also runs in --check

- name: CIS | Build and load the aide_dosfs module
  ansible.builtin.shell: |
    set -e
    cd /etc/selinux/local
    checkmodule -M -m -o aide_dosfs.mod aide_dosfs.te
    semodule_package -o aide_dosfs.pp -m aide_dosfs.mod
    semodule -i aide_dosfs.pp
  when: aide_dosfs_te.changed or 'aide_dosfs' not in selinux_modules.stdout_lines
  changed_when: true

- name: CIS | Check whether the AIDE database already exists
  ansible.builtin.stat:
    path: /var/lib/aide/aide.db.gz
  register: aide_db

# Building the initial database walks the whole filesystem - can take a
# couple of minutes on first run. systemd-run escapes the SSH session's
# private mount namespace (same reasoning as common_sysctl's sysctl tasks).
- name: CIS | Build the initial AIDE database (first run only)
  ansible.builtin.command: systemd-run --wait --pipe --quiet {{ aide_runtime_max_opt }}-- aide --init
  when: not aide_db.stat.exists
  changed_when: true

- name: CIS | Activate the initial AIDE database
  ansible.builtin.command: mv /var/lib/aide/aide.db.new.gz /var/lib/aide/aide.db.gz
  when: not aide_db.stat.exists
  changed_when: true

# mail -s ... root would NOT reach an inbox: msmtp is a plain SMTP client
# with no local alias expansion, so a bare "root" recipient (no @domain) is
# handed to the relay literally and never actually delivered anywhere -
# confirmed live 2026-08-20 (accepted with smtpstatus=250 by the relay, but
# unlike every other notification in this codebase, never reached an inbox).
# Same explicit-address pattern as rkhunter_mail in common_rkhunter.
#
# --workers=$(nproc): one hashing thread per vCPU (AIDE 0.19, see
# common_aide_refresh), nice -n 10 like there.
#
# Silent on a clean run, mails only when AIDE actually finds a difference
# (non-zero exit) - same "OUT=$(...); [ $? -ne 0 ] && mail ..." shape already
# used by the needs-restarting reboot-check cron jobs elsewhere on this host.
- name: CIS | Schedule daily AIDE integrity check
  ansible.builtin.cron:
    name: "AIDE integrity check"
    special_time: daily
    job: >-
      OUT=$({{ aide_timeout_prefix }}nice -n 10 /usr/sbin/aide --check --workers=$(nproc) 2>&1);
      [ $? -ne 0 ] && echo "$OUT" | /usr/bin/mail -s "[$(hostname -f)] AIDE found file integrity changes" {{ aide_mail }};
      /usr/local/sbin/heartbeat-mark aide_check 108000
    user: root

# common_aide_refresh (end of playbook) only re-baselines when an Ansible
# run actually touches this host. dnf-automatic (common_dnf_automatic)
# installs security updates - including kernel swaps - silently every night
# in its own 01:00-02:00 window with no Ansible run involved, so that path
# never refreshed the baseline. Confirmed live 2026-08-29/2026-09-01: a
# kernel update (687.39.1 -> 687.42.1) landed via dnf-automatic, and the
# next @daily "AIDE integrity check" above mailed a false-positive alert
# (3273 added/3273 removed/364 changed, all just old-kernel-out/new-kernel-in
# plus the usual hardlink/inode churn that comes with it) because the
# baseline was still the pre-update one from 3 days earlier.
#
# Fixed by refreshing the baseline once more, at 04:00 - after the
# dnf-automatic install window and the 03:30 reboot-if-needed job
# (common_dnf_automatic) have both settled, but well before the next
# midnight's check above. No mail here on purpose: this is routine
# maintenance, not a finding - see the "unnecessary notifications" ask
# that prompted this fix. Same rc-tolerant shape as common_aide_refresh
# (aide --update's non-zero exit on finding+recording changes is normal,
# not a failure - only the presence of aide.db.new.gz signals success).
- name: CIS | Schedule nightly AIDE baseline refresh (after dnf-automatic's update window)
  ansible.builtin.cron:
    name: "AIDE baseline refresh after automatic updates"
    hour: "4"
    minute: "0"
    job: >-
      {{ aide_timeout_prefix }}nice -n 10 /usr/sbin/aide --update --workers=$(nproc) >/dev/null 2>&1;
      [ -f /var/lib/aide/aide.db.new.gz ] && mv /var/lib/aide/aide.db.new.gz /var/lib/aide/aide.db.gz
      && /usr/local/sbin/heartbeat-mark aide_update 108000
    user: root

# A hand-made /etc/cron.d/aide-check from August 2026 (not in any role, not
# in git) ran a second, single-threaded AIDE check every day at 05:00 on the
# blog - found 2026-10-26. The managed jobs above are the only AIDE runs.
- name: CIS | Remove the stray hand-made AIDE cron file
  ansible.builtin.file:
    path: /etc/cron.d/aide-check
    state: absent

# -----------------------------------------------------------------------------
# Kernel modules: blacklist legacy/unused filesystem drivers
# -----------------------------------------------------------------------------
- name: CIS | Blacklist unused legacy filesystem kernel modules
  ansible.builtin.copy:
    dest: /etc/modprobe.d/cis-blacklist.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (common_cis_hardening) - legacy/rarely-used
      # filesystem and storage drivers with no legitimate use on this host.
      install cramfs /bin/false
      install freevxfs /bin/false
      install hfs /bin/false
      install hfsplus /bin/false
      install jffs2 /bin/false
      install usb-storage /bin/false
      blacklist cramfs
      blacklist freevxfs
      blacklist hfs
      blacklist hfsplus
      blacklist jffs2
      blacklist usb-storage

# Unused network protocols (CIS AlmaLinux 10 L1, kernel_module_*_disabled;
# the same list as CIS AlmaLinux 9). Found by an OpenSCAP scan on the EL10 test
# host, 2026-11-21. Nothing here uses ATM, CAN bus, DCCP, RDS, SCTP, TIPC or
# FireWire - K3s and its Services are TCP/UDP only. Takes effect on the next
# load; none of them is loaded on a running host anyway.
- name: CIS | Block unused network protocol kernel modules
  ansible.builtin.copy:
    dest: /etc/modprobe.d/cis-net-protocols.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (common_cis_hardening) - network protocols with no
      # use on this host (CIS: ATM, CAN, DCCP, RDS, SCTP, TIPC, FireWire).
      {% for m in ['atm', 'can', 'dccp', 'rds', 'sctp', 'tipc', 'firewire-core'] %}
      install {{ m }} /bin/false
      blacklist {{ m }}
      {% endfor %}

# nftables only (2026-10-19): the legacy iptables tables must never come back.
# With them loaded, an iptables-legacy binary (or a container image that brings
# one) can write rules the nftables view does not show, which is how the blog
# ran on iptables-legacy for months. Blocked are the legacy TABLE modules;
# ip_tables and ip6_tables themselves must stay loadable: iptables-nft takes
# some matches from them through nft_compat (the "icmp"/"icmp6" match lives in
# ip_tables/ip6_tables). Blocking them too made K3s's network policy
# controller panic on its ICMP rule after a reboot ("failed to run iptables
# command ... --icmp-type", 2026-10-19 on the blog, ~5 min down). K3s logs a
# harmless "Failed to load kernel module iptable_nat/iptable_filter" warning.
# Takes effect on the next load, i.e. a running host keeps modules that are
# already loaded until its next reboot.
- name: CIS | Block the legacy iptables kernel modules (nftables only)
  ansible.builtin.copy:
    dest: /etc/modprobe.d/no-iptables-legacy.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (common_cis_hardening) - nftables only, no legacy
      # iptables tables. ip_tables/ip6_tables stay: iptables-nft uses their
      # icmp matches (K3s's policy controller fails without them).
      {% for m in ['iptable_filter', 'iptable_nat', 'iptable_mangle', 'iptable_raw', 'iptable_security',
                   'ip6table_filter', 'ip6table_nat', 'ip6table_mangle', 'ip6table_raw', 'ip6table_security'] %}
      install {{ m }} /bin/false
      {% endfor %}

# -----------------------------------------------------------------------------
# journald: persistent storage + compression
# -----------------------------------------------------------------------------
- name: CIS | Configure journald (persistent storage, compressed)
  ansible.builtin.lineinfile:
    path: /etc/systemd/journald.conf
    regexp: "^#?{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
  loop:
    - { key: "Storage", value: "persistent" }
    - { key: "Compress", value: "yes" }
    # Cap disk usage - persistent storage with no cap risks filling the disk.
    - { key: "SystemMaxUse", value: "500M" }
  when: not (os_is_el10 | bool)
  notify: restart journald

# EL10 (systemd 257) ships no /etc/systemd/journald.conf any more, only the
# defaults in /usr/lib/systemd/journald.conf (found 2026-11-21). The same
# three settings go into a drop-in there; EL9 keeps the edited file above.
- name: CIS | Ensure /etc/systemd/journald.conf.d exists (EL10 or journald only)
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: os_is_el10 | bool or cis_journald_only | bool

- name: CIS | Configure journald via drop-in (EL10)
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/50-cis.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (common_cis_hardening) - do not edit manually.
      [Journal]
      Storage=persistent
      Compress=yes
      SystemMaxUse=500M
  when: os_is_el10 | bool
  notify: restart journald

# -----------------------------------------------------------------------------
# Core dumps: disable (may contain secrets from process memory - DB
# passwords, session tokens - and aren't used for debugging this stack)
# -----------------------------------------------------------------------------
- name: CIS | Disable core dumps via limits.d
  ansible.builtin.copy:
    dest: /etc/security/limits.d/99-cis-coredump.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      * hard core 0

- name: CIS | Ensure /etc/systemd/coredump.conf.d exists
  ansible.builtin.file:
    path: /etc/systemd/coredump.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: CIS | Disable core dumps via systemd-coredump
  ansible.builtin.copy:
    dest: /etc/systemd/coredump.conf.d/99-cis-hardening.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Coredump]
      Storage=none
      ProcessSizeMax=0

# fs.suid_dumpable = 0 is set via common_sysctl/templates/98-cis-hardening.conf.j2
# instead of ansible.posix.sysctl here - that module writes directly to
# /proc/sys and fails with "permission denied" under common_ssh's
# ProtectKernelTunables=yes SSH-session sandboxing (confirmed live
# 2026-08-20 via a real playbook run). See that template's comment.

# -----------------------------------------------------------------------------
# cron/at: tighten permissions, restrict to root (only user on this host)
# -----------------------------------------------------------------------------
- name: CIS | Set restrictive permissions on cron directories/files
  ansible.builtin.file:
    path: "{{ item }}"
    mode: "0700"
    owner: root
    group: root
  loop:
    - /etc/cron.d
    - /etc/cron.daily
    - /etc/cron.hourly
    - /etc/cron.weekly
    - /etc/cron.monthly

- name: CIS | Set restrictive permissions on /etc/crontab
  ansible.builtin.file:
    path: /etc/crontab
    mode: "0600"
    owner: root
    group: root

- name: CIS | Ensure /etc/cron.allow and /etc/at.allow exist (root only)
  ansible.builtin.copy:
    dest: "{{ item }}"
    content: "root\n"
    owner: root
    group: root
    mode: "0600"
    force: false  # don't overwrite if already present with different content
  loop:
    - /etc/cron.allow
    - /etc/at.allow

- name: CIS | Remove /etc/cron.deny and /etc/at.deny if present
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/cron.deny
    - /etc/at.deny

# -----------------------------------------------------------------------------
# sudo hardening - safe here because Ansible connects as root directly
# (become: false in ansible.cfg) and never goes through sudo itself.
# -----------------------------------------------------------------------------
- name: CIS | Harden sudo (pty, logfile, re-authentication)
  ansible.builtin.copy:
    dest: /etc/sudoers.d/99-cis-hardening
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"
    content: |
      Defaults use_pty
      Defaults logfile="/var/log/sudo.log"
      Defaults timestamp_timeout=0

# The Nextcloud VPS provider's AlmaLinux image creates a cloud-init default user "almalinux" with
# NOPASSWD:ALL in /etc/sudoers.d/90-cloud-init-users (cvjm, sofie; the blog's
# provider image has no such user). Locked, no keys, never logged in - but a
# passwordless sudo grant has no business existing (found 2026-10-02).
# The account itself stays: UID 1000 is also the UID metrics-server runs as
# inside its pod, so the host shows a live process "owned" by almalinux and
# userdel would refuse. Removing the sudo line and the login shell makes the
# account inert without touching anything that runs.
- name: CIS | Remove the cloud-init default user's sudo grant
  ansible.builtin.lineinfile:
    path: /etc/sudoers.d/90-cloud-init-users
    regexp: '^almalinux\s'
    state: absent
    validate: "visudo -cf %s"

- name: CIS | Check for the cloud-init default user
  ansible.builtin.getent:
    database: passwd
    key: almalinux
    fail_key: false

- name: CIS | Give the cloud-init default user no login shell
  ansible.builtin.user:
    name: almalinux
    shell: /sbin/nologin
  when: (getent_passwd | default({})).get('almalinux') is not none

# -----------------------------------------------------------------------------
# Unused services/packages
# -----------------------------------------------------------------------------
- name: CIS | Disable Bluetooth service
  ansible.builtin.systemd:
    name: bluetooth.service
    enabled: false
    masked: true
    state: stopped
  failed_when: false  # unit may not exist on all kernels/images

# CIS (AlmaLinux 9) asks for the rsync *daemon* to be absent or masked. On EL9
# that daemon ships separately as rsync-daemon (rsyncd.service); the rsync
# client is not a finding. Earlier this task removed the client package:
#  - on the Nextcloud hosts MariaDB-server requires it (Galera SST script), so
#    dnf erased MariaDB along with it: 2-3 min outage per run (2026-09-23);
#  - on the blog host it broke the pull backup, which rsyncs the WordPress
#    volume to the backup machine (2026-09-28).
# So only the daemon package goes, and its unit is masked in case it returns.
- name: CIS | Remove the rsync daemon (rsyncd), keep the rsync client
  ansible.builtin.dnf:
    name: rsync-daemon
    state: absent

- name: CIS | Mask rsyncd.service
  ansible.builtin.systemd:
    name: rsyncd.service
    masked: true
  failed_when: false  # unit file is gone with the package; masking is belt-and-braces

- name: CIS | Make sure the rsync client is installed (backup pulls use it)
  ansible.builtin.dnf:
    name: rsync
    state: present

# NFS/RPC/Samba-client stack pulled in by the base cloud image, not used by
# anything in this repo (no NFS mounts, no Samba shares) - verified via
# `rpm -q --whatrequires` and a `dnf remove --assumeno` dry-run 2026-08-21:
# clean removal, only drags along the unused libwbclient dependency, no
# collateral damage to anything actually in use (unlike avahi-libs/bluez,
# deliberately left alone - that chain drags out sysstat/pcp-libs too).
# rpcbind specifically (UDP/TCP 111) is a known historical target for RPC
# portmapper reflection/amplification abuse - one less unused listener-
# capable daemon on the host.
# cloud-init only matters for the very first boot of a provider image (network,
# root key, hostname). After that it just re-reads the provider metadata on every
# boot - and it is the tool that dropped the Nextcloud VPS image's 50-cloud-init.conf with
# "PasswordAuthentication yes" (see common_ssh). Checked 2026-09-30 before
# disabling: the network profiles are plain files written once at provisioning
# (Nextcloud VPSes: ifcfg-eth0, blog: "Wired connection 1", cloud-init logs "No network
# config applied" on later boots), so nothing depends on it any more.
# The marker file is cloud-init's documented off switch; delete it to re-enable.
- name: CIS | Check whether cloud-init is installed
  ansible.builtin.stat:
    path: /etc/cloud
  register: cis_cloud_dir

- name: CIS | Disable cloud-init after provisioning (marker file)
  ansible.builtin.copy:
    dest: /etc/cloud/cloud-init.disabled
    content: "Disabled by Ansible (common_cis_hardening) - provisioning is done; delete this file to re-enable.\n"
    owner: root
    group: root
    mode: "0644"
  when: cis_cloud_dir.stat.exists

- name: CIS | Remove unused NFS/RPC/Samba-client packages (verified 2026-08-21)
  ansible.builtin.dnf:
    name:
      - nfs-utils
      - rpcbind
      - gssproxy
      - samba-common
      - samba-common-libs
      - samba-client-libs
    state: absent
    autoremove: true

# -----------------------------------------------------------------------------
# Mount hardening: nodev/nosuid/noexec on /tmp, /var/tmp, /dev/shm
# -----------------------------------------------------------------------------
# /tmp and /var/tmp are on the root filesystem here (no separate partition),
# so this uses a bind-remount via fstab rather than repartitioning.
# noexec on /tmp: the only thing in this repo that executes a file from /tmp
# is common_k3s's installer bootstrap, and that's already invoked via `sh
# /tmp/k3s-install.sh` (see common_k3s/tasks/install_k3s.yml) rather than
# executed directly, so it is unaffected by noexec.
# fstab only (state: present), the mount itself happens in the next task.
# Found 2026-11-21 on a fresh test host: "state: mounted" mounts inside the
# SSH session, and that is sshd's own mount namespace (common_ssh sandbox),
# not the host's. When systemd later mounted /var/tmp on the host (a unit
# with PrivateTmp pulls in var-tmp.mount), that mount propagated into
# sshd's namespace ON TOP of the module's own one. From then on the module
# read the source as "/var/tmp/var/tmp", thought nothing was mounted and
# mounted again on every run - shared propagation doubled the stack each
# time (129 layers after ten runs, changed=1 in every drift check). Hosts
# that rebooted with the fstab entry in place (cvjm, sofie) only ever had
# one layer, which is why it never showed there.
- name: CIS | Add hardened mount options for /tmp
  ansible.posix.mount:
    path: /tmp
    src: /tmp
    fstype: none
    opts: bind,nodev,nosuid,noexec
    state: present

- name: CIS | Add hardened mount options for /var/tmp
  ansible.posix.mount:
    path: /var/tmp
    src: /var/tmp
    fstype: none
    opts: bind,nodev,nosuid,noexec
    state: present

- name: CIS | Add hardened mount options for /dev/shm
  ansible.posix.mount:
    path: /dev/shm
    src: tmpfs
    fstype: tmpfs
    opts: nodev,nosuid,noexec
    state: present

# Mount in the HOST namespace (systemd-run escapes the SSH sandbox), only
# where the hardened options are missing there: mount from fstab, or remount
# with the fstab options if something is already mounted at that path. The
# mount then reaches sshd's namespace through propagation, as one layer.
- name: CIS | Apply the hardened mounts on the host
  ansible.builtin.command: >-
    systemd-run --wait --pipe --quiet --collect --
    sh -c 'o=$(findmnt -no OPTIONS --mountpoint {{ item }} || true);
    case "$o" in *nodev*nosuid*noexec*|*nosuid*nodev*noexec*) exit 0 ;; esac;
    if mountpoint -q {{ item }}; then mount -o remount {{ item }}; else mount {{ item }}; fi && echo applied'
  loop:
    - /tmp
    - /var/tmp
    - /dev/shm
  register: cis_host_mounts
  changed_when: "'applied' in cis_host_mounts.stdout"

# -----------------------------------------------------------------------------
# Gaps found by an OpenSCAP scan with the "CIS AlmaLinux OS 10 Level 1 -
# Server" profile on the EL10 test host (2026-11-21: 236 pass, 62 fail). The
# rules below were real gaps on both EL9 and EL10. Deliberately NOT done:
# IP forwarding/rp_filter/log_martians (K3s needs them, see common_sysctl),
# firewalld (nftables), key-only root login (Ansible), the password and PAM
# rules (no password logins exist), a GRUB password (it would lock the
# provider console). rsyslog off came later (cis_journald_only, 2026-11-23).
# -----------------------------------------------------------------------------

# file_permissions_boot_grub2: grubenv came as 0644; grub.cfg is already 0600.
- name: CIS | Check the GRUB environment block
  ansible.builtin.stat:
    path: /boot/grub2/grubenv
  register: cis_grubenv

- name: CIS | GRUB environment block readable by root only
  ansible.builtin.file:
    path: /boot/grub2/grubenv
    mode: "0600"
  when: cis_grubenv.stat.exists

# accounts_umask_etc_login_defs / _etc_bashrc / _etc_profile: 027 instead of
# 022. Applies to new shells; Ansible sets explicit modes on what it writes.
- name: CIS | Default umask 027 in login.defs
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^UMASK\s'
    line: "UMASK\t\t027"

- name: CIS | Default umask 027 in /etc/bashrc
  ansible.builtin.replace:
    path: /etc/bashrc
    regexp: '(\bumask\s+)0?0?22\b'
    replace: '\g<1>027'

- name: CIS | Default umask 027 and idle timeout for login shells
  ansible.builtin.copy:
    dest: /etc/profile.d/cis-shell.sh
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (common_cis_hardening) - CIS accounts_umask_etc_profile
      # and accounts_tmout: umask 027, idle interactive shells end after 15 min.
      umask 027
      typeset -xr TMOUT=900

# aide_check_audit_tools: AIDE also watches the audit tools themselves.
- name: CIS | AIDE checks the audit tools
  ansible.builtin.blockinfile:
    path: /etc/aide.conf
    marker: "# {mark} ANSIBLE MANAGED: audit tools (CIS aide_check_audit_tools)"
    block: |
      {% for t in ['auditctl', 'auditd', 'ausearch', 'aureport', 'autrace', 'augenrules'] %}
      /usr/sbin/{{ t }} p+i+n+u+g+s+b+acl+xattrs+sha512
      {% endfor %}

# configure_custom_crypto_policy_cis: DEFAULT minus CBC ciphers and weak MACs
# for SSH (this also drops the hmac-sha1 MACs the server offered) and minus
# 128-bit MACs. Modern clients use AEAD ciphers and sha2 MACs; tested with the
# Ansible controller and the backup pull. sshd reads the policy at start.
- name: CIS | Crypto policy modules
  ansible.builtin.copy:
    dest: "/etc/crypto-policies/policies/modules/{{ item.name }}.pmod"
    owner: root
    group: root
    mode: "0644"
    content: "{{ item.rule }}\n"
  loop:
    - {name: NO-SSHCBC, rule: "cipher@SSH = -*-CBC"}
    - {name: NO-SSHWEAKCIPHERS, rule: "cipher@SSH = -3DES-CBC -AES-128-CBC -AES-192-CBC -AES-256-CBC"}
    - {name: NO-SSHWEAKMACS, rule: "mac@SSH = -HMAC-MD5* -UMAC-64* -UMAC-128* -HMAC-SHA1*"}
    - {name: NO-WEAKMAC, rule: "mac = -*-128*"}

- name: CIS | Current crypto policy
  ansible.builtin.command: update-crypto-policies --show
  register: cis_crypto_policy
  changed_when: false
  check_mode: false   # read-only query, also runs in --check

- name: CIS | Activate the CIS crypto policy
  ansible.builtin.command: update-crypto-policies --set DEFAULT:NO-SSHCBC:NO-SSHWEAKCIPHERS:NO-SSHWEAKMACS:NO-WEAKMAC
  when: cis_crypto_policy.stdout | trim != 'DEFAULT:NO-SSHCBC:NO-SSHWEAKCIPHERS:NO-SSHWEAKMACS:NO-WEAKMAC'
  changed_when: true
  notify: reload sshd

# no_empty_passwords: pam_unix without "nullok" (authselect feature). Only
# where authselect manages PAM; no account has an empty password anyway.
- name: CIS | Current authselect profile
  ansible.builtin.command: authselect current
  register: cis_authselect
  changed_when: false
  failed_when: false
  check_mode: false   # read-only query, also runs in --check

- name: CIS | No logins with an empty password (authselect without-nullok)
  ansible.builtin.command: authselect enable-feature without-nullok
  when:
    - cis_authselect.rc == 0
    - "'without-nullok' not in cis_authselect.stdout"
  changed_when: true

# package_sequoia-sq_installed: EL10 verifies RPM signatures with Sequoia; the
# sq tool is what the benchmark asks for. EL9 has no such package.
- name: CIS | Sequoia command-line tool (EL10)
  ansible.builtin.dnf:
    name: sequoia-sq
    state: present
  when: os_is_el10 | bool

# cis_journald_only (defaults/main.yml): only journald, no rsyslog.
- name: CIS | journald does not forward to syslog (journald only)
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/60-journald-only.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (common_cis_hardening, cis_journald_only) - do not edit manually.
      [Journal]
      ForwardToSyslog=no
  when: cis_journald_only | bool
  notify: restart journald

- name: CIS | rsyslog stopped, disabled and masked (journald only)
  ansible.builtin.systemd:
    name: rsyslog
    state: stopped
    enabled: false
    masked: true
  when: cis_journald_only | bool
