---
# defaults/ = lowest-priority role variables.

# Console loglevel (2026-11-22). The kernel prints every message below
# console_loglevel also on tty0; with the default 7 that includes each
# nftables log line. On the EL10 test VPS (virtio_gpu, nobody watching the
# virtual screen) the framebuffer then waited for a vblank that never came:
# "[drm] vblank wait timed out" with a stack trace and the kernel tainted W,
# five times a day. true = kernel.printk "4 4 1 7": only errors and worse go
# to the console, everything still lands in the journal. Proven on the test
# host for a night, default for all hosts since 2026-11-23.
sysctl_console_quiet: true
